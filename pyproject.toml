[tool.poetry]
name = "dust-access-simulator"
version = "0.0.2a"
description = "A Simulator for the ECG game Dust Access"
authors = ["Maria Vicidomini <a.vicidomini36@studenti.unisa.it>"]
readme = "README.md"

packages = [
    { include = "DAMA" },
    { include = "core" },
    { include = "networking" },
    { include = "client_views" },
    { include = "bin" },
]

[tool.poetry.dependencies]
python = "^3.13.5"
pandas = "^2.3.3"
websockets = "^15.0.1"
flet = "^0.28.3"
pandas-stubs = "^2.3.3.251201"
seaborn = "^0.13.2"
matplotlib = "^3.10.8"
ipython = "^9.9.0"
notebook = "^7.5.1"
tqdm = "^4.67.1"
plotly = "^6.5.1"
google-generativeai = "^0.8.6"
google-genai = "^1.57.0"

[tool.poetry.scripts]
simulator = "DAMA.simulator:main"
server = "networking.server:server_factory"
client = "client_views.fletapp.client_flet:app_runner"
run-all = "bin.run_all:run_all"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
